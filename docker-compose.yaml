services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-admin-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "19999:19999"
      - "6060:6060"
    environment:
      INSTANCE_ID: app-1
      APP_MYSQL_PASSWORD: "${MYSQL_PASSWORD:-123456}"
      APP_MYSQL_HOST: mysql
      APP_REDIS_HOST: redis
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      APP_JWT_SECRET: "${JWT_SECRET:-docker-dev-secret-change-in-production}"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: go-admin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-123456}"
      MYSQL_DATABASE: go
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: go-admin-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: go-admin-rabbitmq
    ports:
      # 宿主端口用 5673/15673：避免与本机 Mall 项目的 rabbitmq(5672/15672) 冲突
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # 不用 `ping`：它只探测 Erlang 节点存活，此时 5672 监听尚未就绪，
      # app 起来会连不上 AMQP 而崩溃重启（靠 restart 兜底，日志里一串 FATAL）。
      # check_port_connectivity 会等所有 listener 真正可连接。
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: go-admin-swagger-ui
    ports:
      # 宿主机端口用 8288 而非 8081：Windows 上 8081-8180 常被 Hyper-V/WSL
      # 预留（netsh interface ipv4 show excludedportrange protocol=tcp 可查），
      # Docker 绑定会报 "socket access forbidden"。
      - "8288:8080"
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi/openapi.yaml:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
