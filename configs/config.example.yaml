# =============================================================================
# DI 应用配置模板
# =============================================================================
# 复制此文件为 config.yaml 并按需修改。
# 密码和密钥等敏感值建议通过环境变量注入，不要写入文件提交 Git。
#
# 环境变量覆盖规则：
#   前缀 APP_ + 下划线路径（全大写）
#   例如 APP_MYSQL_PASSWORD=xxx 会覆盖 mysql.password
#   例如 APP_JWT_SECRET=xxx 会覆盖 jwt.secret

server:
  port: "19999"
  read_timeout: 30s
  write_timeout: 30s
  cors_origins:               # CORS 白名单（未命中不返回 Allow-Origin）
    - "http://localhost:5173"
    - "http://localhost:3000"

mysql:
  host: "127.0.0.1"
  port: "3306"
  dbname: "go"
  username: "root"
  password: ""                # ← 环境变量 APP_MYSQL_PASSWORD
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h

redis:
  host: "127.0.0.1"
  port: "6379"
  password: ""                # ← 环境变量 APP_REDIS_PASSWORD
  db: 0
  pool_size: 32

jwt:
  secret: "change-me"         # ← 环境变量 APP_JWT_SECRET
  expire_hours: 24

# 注册风控：非空时注册必须带邀请码（APP_AUTH_REGISTER_INVITE_CODE）。
# 演示/公网环境强烈建议设置；不设置则注册开放（仅靠 IP 限流）。
auth:
  register_invite_code: ""

# 演示账号：开启后登录页显示「体验 Demo」按钮（需先执行 cmd/seed 写入种子数据）。
# 公网正式环境如果不想暴露演示入口，设为 false 或删除前端入口。
demo:
  enabled: false              # ← APP_DEMO_ENABLED（公网正式环境不要开启演示入口）
  username: "demo"            # ← APP_DEMO_USERNAME

rabbitmq:
  url: "amqp://guest:guest@127.0.0.1:5672/"  # ← 环境变量 APP_RABBITMQ_URL
  exchange: "chat.events"
  queue: "group_message_push"

logger:
  level: "info"                  # debug / info / warn / error（环境变量 APP_LOGGER_LEVEL）
  format: "console"              # console（开发，带颜色）/ json（生产，结构化可采集）
