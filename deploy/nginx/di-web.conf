# =============================================================================
# DI 前端 Nginx 配置 —— 生产（Ubuntu 22.04, 2C2G）
# =============================================================================
# 安装：
#   sudo apt-get install -y nginx
#   sudo mkdir -p /var/www/di-web
#   sudo tar -xzf di-web-dist.tar.gz -C /var/www/di-web
#   sudo cp deploy/nginx/di-web.conf /etc/nginx/sites-available/di-web
#   sudo ln -s /etc/nginx/sites-available/di-web /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 与 vite 开发代理行为保持一致（见 DI-Web/vite.config.ts）：
#   /api/*  → 去掉 /api 前缀转发到后端 19999
#   /ws     → WebSocket 转发到后端 19999
#
# 关于「/api 301 到 HTTP」问题（评审反馈）：
#   1) absolute_redirect off / server_name_in_redirect off：所有 nginx 自带跳转
#      只发相对路径，不会把请求重定向到内部 host 或 http 协议；
#   2) location = /api 用 308 保留方法（301 会把 POST 改成 GET，且部分客户端行为不一致）；
#   3) proxy_redirect off：不重写后端 Location，避免代理层把 HTTPS 降级为 HTTP；
#   4) 后端已同时注册 /auth/groups 与 /auth/groups/，不再产生 307 尾斜杠跳转。
#   如果前面还有 SLB/CDN 终止 TLS，请确保它转发 X-Forwarded-Proto: https。
# =============================================================================

server {
    listen 80;
    server_name _;   # 换成你的域名或服务器公网 IP

    root /var/www/di-web/dist;
    index index.html;

    # 所有 nginx 重定向用相对路径（关键：避免 https -> http / 内部 host 泄漏）
    absolute_redirect off;
    server_name_in_redirect off;

    client_max_body_size 2m;

    # 2C2G 上开启 gzip：前端产物大量文本，压缩后省带宽也省内存
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 前端静态资源 + SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物：可长缓存（文件名变了才会重新请求）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 兼容不带尾斜杠的 /api：308 保留 POST 方法，且跳转目标是相对路径 ----
    location = /api {
        return 308 /api/;
    }

    # ---- API：与 vite proxy 一致，去掉 /api 前缀 ----
    location /api/ {
        proxy_pass http://127.0.0.1:19999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # 后端首次迁移/重启的短暂窗口，失败快一点让前端提示
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---- WebSocket（私聊/群聊实时消息）----
    location /ws {
        proxy_pass http://127.0.0.1:19999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

