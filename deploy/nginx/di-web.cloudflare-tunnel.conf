# =============================================================================
# DI 前端 Nginx 配置 —— Cloudflare Tunnel 场景（本机 AliYunECS）
# =============================================================================
# 与 deploy/nginx/di-web.conf（裸机直连 80/443）的区别：
#   - 只监听 127.0.0.1:80，公网由 Cloudflare Tunnel 终止 TLS（不配证书）；
#   - 靠 server_name（Host 头）与服务器上其他站点分发，不靠端口；
#   - 保留同样的 /api 去前缀反代与 /ws 升级；额外加固绝对跳转/重定向行为。
#
# 安装位置：/etc/nginx/sites-available/di-web
# 修改后：nginx -t && systemctl reload nginx
# =============================================================================

server {
    listen 127.0.0.1:80;
    server_name di.syloe1.xyz;

    root /var/www/di-web/dist;
    index index.html;

    # 所有 nginx 自动跳转使用相对路径（避免暴露内部 host / 协议降级）
    absolute_redirect off;
    server_name_in_redirect off;

    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 前端静态资源 + SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物：可长缓存（文件名变了才会重新请求）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 兼容不带尾斜杠的 /api：308 保留 POST 方法且为相对跳转 ----
    location = /api {
        return 308 /api/;
    }

    # ---- API：去掉 /api 前缀转发到后端 19999 ----
    location /api/ {
        proxy_pass http://127.0.0.1:19999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare Tunnel 终止 TLS：优先透传边缘的协议头
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---- WebSocket（私聊/群聊实时消息）----
    location /ws {
        proxy_pass http://127.0.0.1:19999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
